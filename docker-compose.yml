services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: releaseguard
      POSTGRES_PASSWORD: releaseguard
      POSTGRES_DB: releaseguard
    ports:
      - "5432:5432"
    volumes:
      - releaseguard_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U releaseguard -d releaseguard"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  releaseguard_pgdata:
